name: Bug report
description: Something draws or behaves incorrectly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest gauge widget that shows the problem.
      render: dart
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gx_gauge version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: flutter doctor -v
      render: text
